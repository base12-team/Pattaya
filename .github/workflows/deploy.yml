# Auto-deploy to your Hetzner server on every push to main.
# One-time setup in GitHub > Settings > Secrets and variables > Actions:
#   HETZNER_HOST     server IP or hostname
#   HETZNER_USER     SSH user (e.g. root or deploy)
#   HETZNER_SSH_KEY  a private key whose public key is in that user's ~/.ssh/authorized_keys
# and on the server, clone this repo to ~/pattaya-rsvp and create .env once (see README).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd ~/pattaya-rsvp
            git pull --ff-only
            docker compose up -d --build
