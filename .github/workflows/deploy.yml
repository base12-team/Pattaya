# Auto-deploy to the Hetzner server on every push to main.
# Setup in GitHub > Settings > Secrets and variables > Actions:
#   HETZNER_HOST     server IP (46.224.147.132)
#   HETZNER_USER     SSH user (samantha)
#   HETZNER_SSH_KEY  a private key whose public key is in that user's ~/.ssh/authorized_keys
# The app runs under pm2 as "pattaya" from ~/pattaya, behind nginx (see README).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd ~/pattaya
            git pull --ff-only
            pm2 restart pattaya
